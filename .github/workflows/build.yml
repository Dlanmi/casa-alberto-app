name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    # La app se despliega en Bogotá (UTC-5) y varios cálculos de fecha
    # asumen TZ local del usuario (helpers `diaSemana`, `toFechaISO`,
    # `tipProximaEntrega`). Forzamos la misma zona horaria en CI para
    # que los tests reflejen el ambiente real.
    env:
      TZ: America/Bogota
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      - name: Build & publish to GitHub Releases
        run: npm run build && npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
